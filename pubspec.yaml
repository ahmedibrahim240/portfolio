name: my_portfolio
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 1.0.0+2

environment:
  sdk: ^3.8.1

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  animated_text_kit: ^4.2.3
  bloc: ^9.0.0
  carousel_slider: ^5.1.1
  cloud_firestore: ^6.0.2
  cupertino_icons: ^1.0.8
  dotted_line: ^3.2.3
  firebase_core: ^4.1.1
  firebase_database: ^12.0.2
  firebase_storage: ^13.0.2
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_native_splash: ^2.4.6
  flutter_staggered_grid_view: ^0.7.0
  flutter_svg: ^2.2.0
  font_awesome_flutter: ^10.5.0
  freezed: ^3.2.0
  freezed_annotation: ^3.1.0
  gap: ^3.0.1
  get_it: ^8.0.3
  # hydrated_bloc: ^10.1.1
  json_annotation: ^4.9.0
  json_serializable: ^6.11.1
  path: ^1.9.1
  path_provider: ^2.1.4
  pretty_animated_text: ^2.0.0
  retrofit: ^4.7.0
  retrofit_generator: ^10.0.1
  url_launcher: ^6.3.2

dev_dependencies:
  build_runner: ^2.6.0
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec
# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true
  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/
    - assets/tayaar/
    - assets/trygc/
    - assets/elite/
    - assets/lite/
    - assets/ikhar/
    - assets/tyasart_clinet/
    - assets/tyasart_com/
flutter_native_splash:
  color: "#121228"
  image: assets/mylogo2.png
  color_dark: "#121228"
  fullscreen: true
  android_12:
    image: assets/mylogo2.png
    icon_background_color: "#121228"
    image_dark: assets/mylogo2.png
    icon_background_color_dark: "#121228"
  web: true
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/mylogo.png"
  min_sdk_android: 21 # android min sdk min:16, default 21
  web:
    generate: true
    image_path: "assets/mylogo.png"
    background_color: "#000"
    theme_color: "#000"
